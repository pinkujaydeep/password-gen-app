<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="Passkee - Generate strong, memorable passwords with word-based patterns">
  <meta name="theme-color" content="#667eea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Passkee">
  <title>Passkee - Strong & Secure Password Generator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔑</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 180 180%22><rect width=%22180%22 height=%22180%22 fill=%22%23667eea%22 rx=%2240%22/><text x=%2290%22 y=%22140%22 font-size=%22120%22 text-anchor=%22middle%22>🔑</text></svg>">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-gradient-1: #667eea;
      --bg-gradient-2: #764ba2;
      --container-bg: #ffffff;
      --text-primary: #2c3e50;
      --text-secondary: #7f8c8d;
      --password-bg: #ecf0f1;
      --password-border: #bdc3c7;
      --info-bg: #f8f9fa;
      --btn-generate: #3498db;
      --btn-generate-hover: #2980b9;
      --btn-copy: #2ecc71;
      --btn-copy-hover: #27ae60;
      --success-color: #27ae60;
      --error-color: #e74c3c;
      --border-color: #e0e0e0;
    }
    
    body.dark-mode {
      --bg-gradient-1: #2d3561;
      --bg-gradient-2: #1e2749;
      --container-bg: #1e2749;
      --text-primary: #e8eaf0;
      --text-secondary: #a0a4b8;
      --password-bg: #2a3152;
      --password-border: #3d4564;
      --info-bg: #262d4a;
      --border-color: #3d4564;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      padding: 15px;
      background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 0.3s ease;
    }
    
    .container {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      background: var(--container-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    
    h1 {
      text-align: center;
      color: var(--text-primary);
      font-size: 20px;
      flex: 1;
      font-weight: 600;
    }
    
    .theme-toggle {
      background: none;
      border: 1.5px solid var(--border-color);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      min-height: 36px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      flex: 0;
    }
    
    .theme-toggle:hover {
      transform: rotate(180deg);
      border-color: var(--btn-generate);
    }
    
    .password-display {
      background: var(--password-bg);
      border: 1.5px solid var(--password-border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      text-align: center;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #password {
      font-family: 'Courier New', monospace;
      font-size: 16px;
      color: var(--text-primary);
      font-weight: 600;
      word-break: break-all;
    }
    
    .strength-meter {
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .strength-label {
      display: none;
    }
    
    .strength-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 18px;
    }
    
    .strength-bar {
      flex: 1;
      height: 4px;
      background: var(--password-border);
      border-radius: 2px;
      overflow: hidden;
    }
    
    .strength-fill {
      height: 100%;
      width: 0%;
      transition: all 0.3s ease;
      border-radius: 2px;
    }
    
    .strength-fill.weak { background: #e74c3c; width: 33%; }
    .strength-fill.medium { background: #f39c12; width: 66%; }
    .strength-fill.strong { background: #2ecc71; width: 100%; }
    
    .strength-icon {
      font-size: 16px;
      min-width: 16px;
    }
    
    button {
      flex: 1;
      padding: 8px 6px;
      border: none;
      border-radius: 8px;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-height: 44px;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-direction: column;
    }
    
    button span.btn-text {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      line-height: 1;
    }
    
    #generateBtn {
      background: var(--btn-generate);
    }
    
    #generateBtn:hover {
      background: var(--btn-generate-hover);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
    }
    
    #copyBtn {
      background: var(--btn-copy);
    }
    
    #copyBtn:hover {
      background: var(--btn-copy-hover);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
    }
    
    .all-buttons {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    
    .export-btn {
      background: #9b59b6;
      font-size: 20px;
    }
    
    .export-btn:hover {
      background: #8e44ad;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(155, 89, 182, 0.3);
    }
    
    .settings-toggle {
      background: #95a5a6;
      font-size: 20px;
    }
    
    .settings-toggle:hover {
      background: #7f8c8d;

    button:active {
      transform: translateY(0);
    }
    
    .status {
      text-align: center;
      min-height: 20px;
      color: var(--success-color);
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s ease;
      margin: 8px 0;

    .status.show {

    }
    
    .settings-panel {
      background: var(--info-bg);
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid var(--border-color);
      display: none;
    }
    
    .settings-panel.show {
      display: block;
      animation: slideDown 0.3s ease;

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }

    .setting-group {
      margin-bottom: 12px;
    }
    
    .setting-group:last-child {

    }
    
    .setting-group label {

      font-size: 12px;

    .toggle-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    
    .toggle-item {
      display: flex;

    .toggle-item input[type="checkbox"] {
      margin: 0;
      cursor: pointer;
    }
    
    .toggle-item span {
      user-select: none;
    }
    
    .setting-group input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--password-border);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    
    .setting-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--btn-generate);
      cursor: pointer;
    }
    
    .setting-group input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--btn-generate);
      cursor: pointer;
      border: none;
    }
    
    .range-value {
      display: inline-block;
      min-width: 30px;
      text-align: center;
      font-weight: bold;
      color: var(--btn-generate);
    }
    
    .history-panel {
      background: var(--info-bg);
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid var(--border-color);
    }
    
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .history-header h3 {
      font-size: 13px;
      color: var(--text-primary);
      font-weight: 600;
      margin: 0;
      flex: 1;
    }
    
    .clear-history {
      background: none;
      border: none;
      color: var(--error-color);
      font-size: 12px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      min-height: auto;
      white-space: nowrap;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    
    .clear-history:hover {
      background: var(--error-color);
      color: white;
      transform: none;
    }
    
    .history-list {
      max-height: 250px;
      overflow-y: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    
    .history-list::-webkit-scrollbar {
      display: none;
    }
    
    .history-item {
      background: var(--container-bg);
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }
    
    .history-item:last-child {
      margin-bottom: 0;
    }
    
    .history-pwd {
      flex: 1;
      word-break: break-all;
      margin-right: 10px;
    }
    
    .history-copy {
      background: var(--btn-copy);
      border: none;
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      min-height: auto;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .history-copy:hover {
      background: var(--btn-copy-hover);
      transform: none;
    }
    
    .no-history {
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
      padding: 20px;
    }
    
    .keyboard-hint {
      text-align: center;
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 8px;
      padding: 6px;
      background: var(--info-bg);
      border-radius: 6px;
    }
    
    .keyboard-hint kbd {
      background: var(--container-bg);
      border: 1px solid var(--border-color);
      border-radius: 3px;
      padding: 2px 5px;
      font-family: monospace;
      font-size: 10px;
    }
    
    @media (max-width: 768px) {
      body {
        padding: 0;
        align-items: flex-start;
        overflow: hidden;
      }
      
      .container {
        padding: 20px;
        max-width: 100%;
        margin: 0 auto;
        border-radius: 0;
        height: 100vh;
        max-height: 100vh;
        box-shadow: none;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      
      h1 {
        font-size: 20px;
      }
      
      .theme-toggle {
        width: 36px;
        height: 36px;
        min-height: 36px;
      }
      
      .history-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        margin-bottom: 0;
        margin-top: 8px;
        min-height: 0;
        overflow: hidden;
        border-radius: 0;
        padding: 12px;
        padding-bottom: 0;
      }
      
      .history-list {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
        max-height: none;
        -ms-overflow-style: none;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 12px;
      }
      
      .history-list::-webkit-scrollbar {
        display: none;
      }
    }
    
    @media (max-width: 480px) {
      body {
        padding: 0;
        height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        overflow: hidden;
      }
      
      .container {
        padding: 18px;
        border-radius: 0;
        width: 100%;
        max-width: 100%;
        height: 100vh;
        max-height: 100vh;
        box-shadow: none;
      }
      
      h1 {
        font-size: 18px;
      }
      
      #password {
        font-size: 15px;
      }
      
      button {
        padding: 10px 5px;
        font-size: 18px;
      }
      
      button span.btn-text {
        font-size: 8px;
      }
      
      .history-item {
        font-size: 11px;
        padding: 10px 8px;
      }
      
      .history-pwd {
        font-size: 11px;
      }
      
      .history-copy {
        padding: 6px 8px;
        font-size: 14px;
      }
      
      .keyboard-hint {
        font-size: 10px;
      }
      
      .keyboard-hint kbd {
        font-size: 10px;
        padding: 1px 4px;
      }
    }
    
    @media (max-width: 360px) {
      body {
        padding: 0;
      }
      
      .container {
        padding: 15px;
        border-radius: 0;
      }
      
      h1 {
        font-size: 16px;
      }
      
      #password {
        font-size: 13px;
      }
      
      .theme-toggle {
        width: 32px;
        height: 32px;
        min-height: 32px;
        font-size: 16px;
      }
    }
    
    @media (hover: none) {
      button:hover {
        transform: none;
      }
      
      .theme-toggle:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔑 Passkee</h1>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark Mode" aria-label="Toggle theme">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
    
    <div class="password-display">
      <div id="password">Click Generate</div>
    </div>
    
    <div class="strength-meter">
      <span class="strength-icon" id="strengthIcon">🔒</span>
      <div class="strength-bar">
        <div class="strength-fill" id="strengthFill"></div>
      </div>
    </div>
    
    <div class="all-buttons">
      <button id="generateBtn" onclick="generateNewPassword()" title="Generate Password (Enter)" aria-label="Generate password">
        🔄<span class="btn-text">Gen</span>
      </button>
      <button id="copyBtn" onclick="copyToClipboard()" title="Copy to Clipboard (Ctrl+K)" aria-label="Copy to clipboard">
        📋<span class="btn-text">Copy</span>
      </button>
      <button class="settings-toggle" onclick="toggleSettings()" title="Customize Settings" aria-label="Open settings">
        ⚙️<span class="btn-text">Set</span>
      </button>
      <button class="export-btn" onclick="exportPasswords()" title="Export Password History" aria-label="Export passwords">
        💾<span class="btn-text">Exp</span>
      </button>
    </div>
    
    <div class="status" id="status"></div>
    
    <div class="keyboard-hint">
      Shortcuts: <kbd>Enter</kbd> Generate • <kbd>Ctrl+K</kbd> Copy
    </div>
    
    <div class="settings-panel" id="settingsPanel">
      <div class="setting-group">
        <label>
          Length: <span class="range-value" id="lengthValue">16</span>
        </label>
        <input type="range" id="lengthSlider" min="8" max="16" value="16" oninput="updateLength()">
      </div>
      
      <div class="setting-group">
        <div class="toggle-options">
          <label class="toggle-item">
            <input type="checkbox" id="includeSymbols" checked onchange="saveSettings()">
            <span>!@#$%</span>
          </label>
          <label class="toggle-item">
            <input type="checkbox" id="includeNumbers" checked onchange="saveSettings()">
            <span>0-9</span>
          </label>
          <label class="toggle-item">
            <input type="checkbox" id="includeWords" checked onchange="saveSettings()">
            <span>🎯 Words</span>
          </label>
          <label class="toggle-item">
            <input type="checkbox" id="useOnlineWords" onchange="saveSettings()">
            <span>🌐 Online</span>
          </label>
        </div>
      </div>
    </div>
    
    <div class="history-panel">
      <div class="history-header">
        <h3>📜 History</h3>
        <button class="clear-history" onclick="clearHistory()">🗑️ Clear</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="no-history">No passwords yet</div>
      </div>
    </div>
  </div>

  <script>
    // Password generation logic (client-side)
    const WORDS = [
      // general
      "travel","coffee","dragon","forest","sunrise","canvas","rocket","whisper",
      "timber","velocity","wander","echo","ember","quantum","matrix","crystal",
      "harbor","atlas","fusion","shadow","storm","planet","orbit","signal",
      "charge","vector","pixel","binary","cipher","hunter","falcon","tiger",
      "wolf","eagle","ninja","samurai","knight","vortex","nova","comet",
      "nebula","galaxy","cosmic","plasma","gravity","energy","light","dark",
      "silent","rapid","bold","frozen","wild","brave","sharp","swift",
      "smart","giant","tiny","lunar","solar","metal","iron","steel",
      "stone","flame","spark","cloud","rain","wind","snow","thunder",
      "power","drive","build","create","shift","break","grow","run",
      "jump","think","move","watch","scan","hack","code","debug",
      "deploy","push","pull","merge","commit","branch","stack","queue",
      
      // actions
      "build","deploy","scale","monitor","debug","commit","merge","branch",
      "release","backup","restore","secure","harden","scan","test","verify",
      "compile","package","ship","provision","configure","orchestrate",
      "optimize","observe","automate","log","trace","alert",
      
      // dev / languages
      "python","java","golang","node","react","angular","flask","django",
      "spring","dotnet","kotlin","rust","bash","powershell",
      
      // cloud / infra
      "aws","azure","gcp","docker","kubernetes","terraform","ansible",
      "packer","helm","jenkins","gitlab","github","bitbucket",
      "vpc","subnet","firewall","loadbalancer","gateway","dns","cdn",
      
      // sre concepts
      "latency","uptime","throughput","reliability","availability",
      "scalability","resilience","capacity","incident","postmortem",
      "slo","sla","slis","errorbudget",
      
      // security
      "token","secret","vault","cipher","hash","salt","keypair","oauth",
      "kerberos","cert","tls","https","zeroTrust"
    ];
    
    const SYMBOLS = "!@#$%^&*?";
    const LOWERCASE = "abcdefghijklmnopqrstuvwxyz";
    const UPPERCASE = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const NUMBERS = "0123456789";
    
    let settings = {
      length: 16,
      includeSymbols: true,
      includeNumbers: true,
      includeWords: true,
      darkMode: false,
      useOnlineWords: false
    };
    
    function randomWord() {
      const word = WORDS[Math.floor(Math.random() * WORDS.length)];
      return word.charAt(0).toUpperCase() + word.slice(1);
    }
    
    function randomChar(charset) {
      return charset.charAt(Math.floor(Math.random() * charset.length));
    }
    
    function generatePassword(minLength = 16, maxLength = 24) {
      // Use settings length if available
      minLength = settings.length || 16;
      maxLength = settings.length + 4 || 24;
      
      let pwd = "";
      let attempts = 0;
      
      if (settings.includeWords) {
        while (attempts < 50) {
          const w1 = randomWord();
          const w2 = randomWord();
          const w3 = randomWord();
          const num = String(Math.floor(Math.random() * (9999 - 10 + 1)) + 10);
          const sym = settings.includeSymbols ? SYMBOLS.charAt(Math.floor(Math.random() * SYMBOLS.length)) : '';
          
          const patterns = settings.includeSymbols ? [
            `${w1}${sym}${num}${w2}`,
            `${w1}${w2}${sym}${num}`,
            `${w1}${sym}${num}${w2}${w3}`,
            `${w1}${sym}${w2}${num}`,
            `${w1}${w2}${sym}${num}${w3}`
          ] : [
            `${w1}${num}${w2}`,
            `${w1}${w2}${num}`,
            `${w1}${num}${w2}${w3}`
          ];
          
          pwd = patterns[Math.floor(Math.random() * patterns.length)];
          
          if (pwd.length >= minLength && pwd.length <= maxLength) {
            return pwd;
          }
          
          attempts++;
        }
        
        if (pwd.length > maxLength) {
          pwd = pwd.substring(0, maxLength);
        }
      } else {
        // Character-based generation
        let charset = LOWERCASE + UPPERCASE;
        if (settings.includeNumbers) charset += NUMBERS;
        if (settings.includeSymbols) charset += SYMBOLS;
        
        for (let i = 0; i < minLength; i++) {
          pwd += randomChar(charset);
        }
      }
      
      return pwd;
    }
    
    function calculateStrength(password) {
      let strength = 0;
      
      if (password.length >= 12) strength += 25;
      if (password.length >= 16) strength += 25;
      if (/[a-z]/.test(password)) strength += 10;
      if (/[A-Z]/.test(password)) strength += 10;
      if (/[0-9]/.test(password)) strength += 15;
      if (/[!@#$%^&*?]/.test(password)) strength += 15;
      
      return Math.min(100, strength);
    }
    
    function updateStrengthMeter(password) {
      const strength = calculateStrength(password);
      const fill = document.getElementById('strengthFill');
      const icon = document.getElementById('strengthIcon');
      
      fill.className = 'strength-fill';
      
      if (strength < 50) {
        fill.classList.add('weak');
        icon.textContent = '🔓';
        icon.title = 'Weak';
      } else if (strength < 80) {
        fill.classList.add('medium');
        icon.textContent = '🔐';
        icon.title = 'Medium';
      } else {
        fill.classList.add('strong');
        icon.textContent = '🔒';
        icon.title = 'Strong';
      }
    }
    
    function generateNewPassword() {
      const passwordEl = document.getElementById('password');
      const password = generatePassword();
      passwordEl.textContent = password;
      updateStrengthMeter(password);
      addToHistory(password);
      showStatus(`✓ Password generated! Length: ${password.length}`, 'success');
    }
    
    function copyToClipboard() {
      const password = document.getElementById('password').textContent;
      
      if (password && password !== 'Click Generate' && password !== 'Generating...') {
        // Modern Clipboard API with fallback
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(password)
            .then(() => {
              showStatus('✓ Password copied to clipboard!', 'success');
            })
            .catch(() => {
              fallbackCopyToClipboard(password);
            });
        } else {
          fallbackCopyToClipboard(password);
        }
      } else {
        showStatus('⚠ Generate a password first!', 'error');
      }
    }
    
    function fallbackCopyToClipboard(text) {
      const tempInput = document.createElement('input');
      tempInput.value = text;
      document.body.appendChild(tempInput);
      tempInput.select();
      tempInput.setSelectionRange(0, 99999);
      
      try {
        document.execCommand('copy');
        showStatus('✓ Password copied to clipboard!', 'success');
      } catch (err) {
        showStatus('⚠ Failed to copy password', 'error');
      }
      
      document.body.removeChild(tempInput);
    }
    
    function showStatus(message, type) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = message;
      statusEl.style.color = type === 'error' ? '#e74c3c' : '#27ae60';
      statusEl.classList.add('show');
      
      setTimeout(function() {
        statusEl.classList.remove('show');
      }, 3000);
    }
    
    // Settings Management
    function loadSettings() {
      try {
        const saved = localStorage.getItem('pwdGenSettings');
        if (saved) {
          settings = JSON.parse(saved);
          document.getElementById('lengthSlider').value = settings.length;
          document.getElementById('lengthValue').textContent = settings.length;
          document.getElementById('includeSymbols').checked = settings.includeSymbols;
          document.getElementById('includeNumbers').checked = settings.includeNumbers;
          document.getElementById('includeWords').checked = settings.includeWords;
          if (document.getElementById('useOnlineWords')) {
            document.getElementById('useOnlineWords').checked = settings.useOnlineWords || false;
          }
        }
        
        const darkMode = localStorage.getItem('darkMode') === 'true';
        if (darkMode) {
          document.body.classList.add('dark-mode');
          settings.darkMode = true;
          document.getElementById('themeIcon').textContent = '☀️';
        }
      } catch(e) {
        console.error('Failed to load settings', e);
      }
    }
    
    function saveSettings() {
      settings.length = parseInt(document.getElementById('lengthSlider').value);
      settings.includeSymbols = document.getElementById('includeSymbols').checked;
      settings.includeNumbers = document.getElementById('includeNumbers').checked;
      settings.includeWords = document.getElementById('includeWords').checked;
      
      if (document.getElementById('useOnlineWords')) {
        settings.useOnlineWords = document.getElementById('useOnlineWords').checked;
      }
      
      try {
        localStorage.setItem('pwdGenSettings', JSON.stringify(settings));
      } catch(e) {
        console.error('Failed to save settings', e);
      }
    }
    
    function updateLength() {
      const length = document.getElementById('lengthSlider').value;
      document.getElementById('lengthValue').textContent = length;
      saveSettings();
    }
    
    function toggleSettings() {
      const panel = document.getElementById('settingsPanel');
      panel.classList.toggle('show');
    }
    
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('darkMode', isDark);
      settings.darkMode = isDark;
    }
    
    // History Management
    function addToHistory(password) {
      try {
        let history = JSON.parse(localStorage.getItem('pwdHistory') || '[]');
        history.unshift(password);
        history = history.slice(0, 10);
        localStorage.setItem('pwdHistory', JSON.stringify(history));
        renderHistory();
      } catch(e) {
        console.error('Failed to save to history', e);
      }
    }
    
    function renderHistory() {
      try {
        const history = JSON.parse(localStorage.getItem('pwdHistory') || '[]');
        const historyList = document.getElementById('historyList');
        
        if (history.length === 0) {
          historyList.innerHTML = '<div class="no-history">No passwords yet</div>';
          return;
        }
        
        historyList.innerHTML = history.map(pwd => `
          <div class="history-item">
            <span class="history-pwd">${pwd}</span>
            <button class="history-copy" onclick="copyFromHistory('${pwd.replace(/'/g, "\\'")}')">📋</button>
          </div>
        `).join('');
      } catch(e) {
        console.error('Failed to render history', e);
      }
    }
    
    function copyFromHistory(password) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(password)
          .then(() => {
            showStatus('✓ Password copied!', 'success');
          })
          .catch(() => {
            fallbackCopyToClipboard(password);
          });
      } else {
        fallbackCopyToClipboard(password);
      }
    }
    
    function clearHistory() {
      if (confirm('Clear all password history?')) {
        localStorage.removeItem('pwdHistory');
        renderHistory();
        showStatus('✓ History cleared', 'success');
      }
    }
    
    function exportPasswords() {
      try {
        const history = JSON.parse(localStorage.getItem('pwdHistory') || '[]');
        
        if (history.length === 0) {
          showStatus('⚠ No passwords to export', 'error');
          return;
        }
        
        const content = 'Passkee - Password History\\n' + 
                       '==========================\\n\\n' +
                       history.join('\\n') +
                       '\\n\\nExported: ' + new Date().toLocaleString();
        
        const blob = new Blob([content], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `passkee-passwords-${Date.now()}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        showStatus('✓ Passwords exported!', 'success');
      } catch(e) {
        console.error('Export failed', e);
        showStatus('⚠ Export failed', 'error');
      }
    }
    
    // Keyboard shortcuts
    function setupKeyboardShortcuts() {
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.altKey) {
          e.preventDefault();
          generateNewPassword();
        }
        
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
          e.preventDefault();
          copyToClipboard();
        }
      });
    }
    
    // Initialize on page load
    window.onload = function() {
      loadSettings();
      renderHistory();
      setupKeyboardShortcuts();
      //generateNewPassword();
    };
  </script>
</body>
</html>
